services:
  - type: web
    name: jawwalpay-cache-service
    env: node
    rootDir: backend
    branch: master
    autoDeploy: true
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "3000"
      # DB_PATH removed — use DATABASE_URL (Neon) for production persistence
