<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawwal Pay UX+</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Jawwal Pay UX+</div>
    </header>
    
    <div class="content">
      <div class="toggle-section">
        <label class="toggle-label">
          <input type="checkbox" id="enableToggle">
          <span class="toggle-slider"></span>
          <span class="toggle-text">Enable on this site</span>
        </label>
      </div>
      
      <div class="status-section">
        <div class="status-label">Detected page:</div>
        <div class="status-value" id="detectedPage">Loading...</div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
